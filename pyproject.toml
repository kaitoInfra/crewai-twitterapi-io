[project]
name = "crewai-twitterapi-io"
version = "0.1.0"
description = "CrewAI tools for reading X (Twitter) data through the TwitterAPI.io REST API: tweet search and user profiles with recent tweets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "TwitterAPI.io", email = "hello@twitterapi.io" }]
keywords = ["crewai", "twitter", "x", "tweets", "agents", "tools", "twitterapi.io"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "crewai>=0.100.0",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://twitterapi.io"
Documentation = "https://docs.twitterapi.io"
Repository = "https://github.com/kaitoInfra/crewai-twitterapi-io"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_twitterapi_io"]
